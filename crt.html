<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Attendance System</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef2f3;
    }

    /* LOGIN UI */
    .container {
        width: 400px;
        margin: 60px auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 5px;
        border: 1px solid #aaa;
    }
    button {
        background: #3546d4;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover { background: #2c3ac2; }

    h2 { text-align: center; margin-bottom: 20px; color: #333; }

    #output, #outputStaff {
        margin-top: 15px;
        background: #f4f4f4;
        padding: 10px;
        border-radius: 5px;
    }


    /* ======================== STAFF DASHBOARD ======================== */

    .navbar {
        background: #3546d4;
        padding: 15px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
    }

    .tabs {
        display: flex;
        gap: 15px;
        padding: 15px;
        background: #fff;
        border-bottom: 1px solid #ccc;
    }
    .tab {
        padding: 10px 18px;
        background: #e4e7ff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    .tab.active { background: #3546d4; color: white; }

    .panel {
        width: 90%;
        margin: 20px auto;
        background: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    table th, table td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
    }

    .header-title {
        font-size: 22px;
        font-weight: bold;
        color: #3546d4;
        margin-bottom: 5px;
    }

    .status-btn { transform: scale(1.3); }

</style>
</head>
<body>

<!-- ========================= LOGIN PAGE ========================= -->
<div class="container" id="loginBox">
    <h2>Login</h2>
    <input type="text" id="loginId" placeholder="Enter Student Roll No / Staff ID">
    <button onclick="login()">Login</button>
</div>

<!-- ========================= STUDENT PANEL ========================= -->
<div class="container" id="studentBox" style="display:none;">
    <h2>Student Panel</h2>

    <input type="text" id="roll_student" placeholder="Enter Roll No">

    <select id="studentAction">
        <option value="percent">Check Attendance %</option>
        <option value="alert">Low Attendance Alert</option>
        <option value="mark">Mark Today's Attendance</option>
    </select>

    <select id="status" style="display:none;">
        <option value="Present">Present</option>
        <option value="Absent">Absent</option>
    </select>

    <button onclick="studentActions()">Submit</button>
    <div id="output"></div>
</div>

<!-- ========================= STAFF DASHBOARD ========================= -->
<div id="staffDashboard" style="display:none;">

    <div class="navbar">Staff Attendance Dashboard</div>

    <div class="tabs">
        <div class="tab active" onclick="loadClass('CSE-A', this)">Class CSE-A</div>
        <div class="tab" onclick="loadClass('CSE-B', this)">Class CSE-B</div>
        <div class="tab" onclick="loadClass('CSE-C', this)">Class CSE-C</div>
    </div>

    <div class="panel">
        <div class="header-title" id="classTitle">Class CSE-A Attendance</div>

        <table id="studentTable">
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Present</th>
                <th>Absent</th>
            </tr>
        </table>
    </div>
</div>


<script>
/* ========================= LOGIN LOGIC ========================= */

function login() {
    let id = document.getElementById("loginId").value.trim();

    if (id.startsWith("A") || id.startsWith("B") || id.startsWith("C")) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("studentBox").style.display = "block";
        document.getElementById("roll_student").value = id;
    }
    else if (id.toLowerCase().startsWith("staff")) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("staffDashboard").style.display = "block";
        loadClass("CSE-A", document.querySelector(".tab"));
    }
    else {
        alert("Invalid Login ID");
    }
}


/* ========================= STUDENT PANEL LOGIC ========================= */

document.getElementById("studentAction").addEventListener("change", function () {
    document.getElementById("status").style.display = 
        this.value === "mark" ? "block" : "none";
});

function studentActions() {
    let action = document.getElementById("studentAction").value;
    let roll = document.getElementById("roll_student").value;
    let output = document.getElementById("output");

    if (action === "percent") {
        output.innerHTML = "Your attendance is: <b>82%</b>";
    }
    else if (action === "alert") {
        output.innerHTML = "<b>No Alert</b>: Attendance above 75%.";
    }
    else if (action === "mark") {
        let st = document.getElementById("status").value;
        output.innerHTML = "Attendance Marked: <b>" + st + "</b>";
    }
}


/* ========================= STAFF DASHBOARD LOGIC ========================= */

const students = {
    "CSE-A": [
        { roll: "A101", name: "Arun Kumar" },
        { roll: "A102", name: "Bhuvana" },
        { roll: "A103", name: "Charan" }
    ],
    "CSE-B": [
        { roll: "B201", name: "Harish" },
        { roll: "B202", name: "Karthika" }
    ],
    "CSE-C": [
        { roll: "C301", name: "Praveen" },
        { roll: "C302", name: "Sahana" }
    ]
};


function loadClass(className, element) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    element.classList.add("active");

    document.getElementById("classTitle").innerHTML = className + " Attendance";

    let table = document.getElementById("studentTable");
    table.innerHTML = `
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Present</th>
            <th>Absent</th>
        </tr>`;

    students[className].forEach(st => {
        table.innerHTML += `
            <tr>
                <td>${st.roll}</td>
                <td>${st.name}</td>
                <td><input type="radio" class="status-btn" name="${st.roll}" value="Present"></td>
                <td><input type="radio" class="status-btn" name="${st.roll}" value="Absent"></td>
            </tr>
        `;
    });
}

</script>

</body>
</html>
